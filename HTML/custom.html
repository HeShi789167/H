<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自定义主页 & 贴纸</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{max-width:750px;margin:40px auto;padding:0 20px;background:#f7f3ec;}
h1{color:#3a3a3a;text-align:center;}
.upload-area{
  background:#fff;
  padding:16px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  margin-bottom:20px;
}
#canvas-wrap{
  width:100%;
  height:420px;
  background:#ffffff;
  border-radius:10px;
  position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  overflow:hidden;
}
.sticker{
  position:absolute;
  width:100px;
  cursor:move;
}
button{
  padding:9px 16px;
  margin:4px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}
button.upload-btn{background:#508c9b;color:white;}
button.del{background:#bb4444;color:white;}
button:hover{opacity:0.85;}
.back-link{
  display:block;text-align:center;margin:20px 0;color:#508c9b;text-decoration:none;
}
/* 隐藏原生文件框 */
#fileInput{
  display:none;
}
</style>
</head>
<body>
<h1>🎨 自定义主页贴纸</h1>
<div class="upload-area">
  <!-- 隐藏原生文件输入框 -->
  <input type="file" id="fileInput" accept=".png">
  <!-- ✅ 这个就是显眼的【添加PNG贴纸】按钮！ -->
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">添加PNG贴纸</button>
  <button onclick="saveLayout()">保存主页布局</button>
  <button class="del" onclick="clearAllStickers()">清空所有贴纸</button>
  <p>提示：选择png透明图片，上传后可以拖动贴纸</p>
</div>

<!-- 主页画布区域，放贴纸 -->
<div id="canvas-wrap"></div>

<a class="back-link" href="index.html">← 返回日记首页</a>

<script>
const wrap = document.getElementById("canvas-wrap");
const fileInput = document.getElementById("fileInput");

// 拖拽相关变量
let dragTarget = null;
let offsetX, offsetY;

// 读取PNG文件
fileInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(event){
    addSticker(event.target.result);
  }
  reader.readAsDataURL(file);
  // 重置，可以重复选同一个文件
  fileInput.value = "";
}

// 创建贴纸元素
function addSticker(src){
  const img = document.createElement("img");
  img.src = src;
  img.className = "sticker";
  img.style.left = "50px";
  img.style.top = "50px";
  img.onmousedown = startDrag;
  wrap.appendChild(img);
}

// 拖拽开始
function startDrag(e){
  dragTarget = e.target;
  offsetX = e.clientX - dragTarget.getBoundingClientRect().left;
  offsetY = e.clientY - dragTarget.getBoundingClientRect().top;
  document.addEventListener("mousemove", dragMove);
  document.addEventListener("mouseup", stopDrag);
}
function dragMove(e){
  if(!dragTarget) return;
  const rect = wrap.getBoundingClientRect();
  let x = e.clientX - rect.left - offsetX;
  let y = e.clientY - rect.top - offsetY;
  dragTarget.style.left = x + "px";
  dragTarget.style.top = y + "px";
}
function stopDrag(){
  dragTarget = null;
  document.removeEventListener("mousemove", dragMove);
  document.removeEventListener("mouseup", stopDrag);
}

// 保存布局到本地存储
function saveLayout(){
  const stickers = [];
  document.querySelectorAll(".sticker").forEach(img=>{
    stickers.push({
      src: img.src,
      left: img.style.left,
      top: img.style.top,
      width: img.style.width
    })
  })
  localStorage.setItem("homeStickers", JSON.stringify(stickers));
  alert("主页贴纸布局已保存！");
}

// 加载贴纸布局
function loadLayout(){
  const raw = localStorage.getItem("homeStickers");
  if(!raw) return;
  const stickers = JSON.parse(raw);
  stickers.forEach(s=>{
    const img = document.createElement("img");
    img.src = s.src;
    img.className = "sticker";
    img.style.left = s.left;
    img.style.top = s.top;
    img.style.width = s.width;
    img.onmousedown = startDrag;
    wrap.appendChild(img);
  })
}

function clearAllStickers(){
  if(confirm("清空全部贴纸？")){
    wrap.innerHTML = "";
    localStorage.removeItem("homeStickers");
  }
}
