<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>笔记</title>
<style>
body{max-width:700px;margin:30px auto;padding:0 20px;}
textarea{width:100%;height:200px;padding:8px;margin:8px 0;}
input{width:100%;padding:8px;margin:8px 0;}
button{padding:8px 16px;cursor:pointer;}
.diary-item{border:1px solid #ccc;padding:10px;margin:10px 0;}
</style>
</head>
<body>
<h1>✍️ 我的笔记</h1>

<h3>笔记标题</h3>
<input type="text" id="title" placeholder="输入标题">
<h3>笔记内容</h3>
<textarea id="content" placeholder="在这里写日记或者笔记……"></textarea>
<button onclick="saveDiary()">保存笔记</button>
<button onclick="clearAll()">清空全部笔记</button>

<p><a href="index.html">← 返回日记首页</a></p>

<h3>已保存笔记</h3>
<div id="list"></div>

<script>
function loadDiary(){
  let diarys = JSON.parse(localStorage.getItem("myDiary")) || [];
  let box = document.getElementById("list");
  box.innerHTML = "";
  diarys.forEach(function(item,index){
    box.innerHTML += `
    <div class="diary-item">
      <h4>${item.title}</h4>
      <p>${item.content}</p>
      <button onclick="delDiary(${index})">删除这篇</button>
    </div>
    `
  })
}

function saveDiary(){
  let title = document.getElementById("title").value;
  let content = document.getElementById("content").value;
  if(!title || !content){
    alert("标题和内容不能为空！");
    return;
  }
  let diarys = JSON.parse(localStorage.getItem("myDiary")) || [];
  diarys.push({title,content});
  localStorage.setItem("myDiary", JSON.stringify(diarys));
  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
  loadDiary();
  alert("保存成功！");
}

function delDiary(index){
  let diarys = JSON.parse(localStorage.getItem("myDiary")) || [];
  diarys.splice(index,1);
  localStorage.setItem("myDiary", JSON.stringify(diarys));
  loadDiary();
}

function clearAll(){
  if(confirm("确定删除所有笔记？无法恢复！")){
    localStorage.removeItem("myDiary");
    loadDiary();
  }
}

loadDiary();
</script>
</body>
</html>
<textarea style="width:400px;height:250px;" placeholder="在这里写笔记"></textarea>
</script>

</body>
</html>
